## Builds, signs and publishes a release APK. See docs/RELEASE-OTA.md.
##
## The signing key lives in the PRODUCTION environment's secrets, so this job declares
## `environment: PRODUCTION`: without that line the secrets arrive empty and signing fails.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v1.0.0"
        required: true

# Nothing by default; the job below asks for exactly what it needs.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: PRODUCTION
    permissions:
      contents: write # create the release and upload its assets
    steps:
      # Runs before the checkout so a malformed tag fails in seconds.
      - name: Resolve the version from the tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$tag' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          # versionCode = major*10000 + minor*100 + patch, so it only ever grows.
          if (( minor > 99 || patch > 99 )); then
            echo "::error::minor and patch must stay below 100 to keep versionCode monotonic"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "name=${tag#v}"
            echo "code=$(( major * 10000 + minor * 100 + patch ))"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.tag }}
          persist-credentials: false

      # Matches gradle/gradle-daemon-jvm.properties (toolchainVersion 25), so Gradle uses this JDK
      # instead of downloading its own.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      # Handles the Gradle cache and wrapper validation. Gradle's own docs advise against
      # actions/setup-java's `cache: gradle` for this.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Decode the signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # $RUNNER_TEMP, never the workspace: nothing here can end up in the published assets.
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          if [[ ! -s "$RUNNER_TEMP/release.keystore" ]]; then
            echo "::error::Empty keystore. The secrets live in the PRODUCTION environment: check that this job still declares 'environment: PRODUCTION' and that RELEASE_KEYSTORE_BASE64 is set there."
            exit 1
          fi

      - name: Build and test the signed release
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease testReleaseUnitTest --console=plain \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Verify the signature
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          # Without a key Gradle emits app-release-unsigned.apk instead of failing: catch that here
          # rather than publishing something the tablets would refuse to install.
          if [[ ! -f "$apk" ]]; then
            echo "::error::No signed APK at $apk — the signing key never reached Gradle."
            ls -1 app/build/outputs/apk/release/
            exit 1
          fi
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          # The certificate is public; its SHA-256 must stay identical across every release.
          "$apksigner" verify --verbose --print-certs "$apk"

      - name: Prepare the assets
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="dist/hakiosk-$VERSION_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          # What the tablets read to decide whether to update, and to verify what they downloaded.
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/hakiosk-$VERSION_NAME.apk" \
            --arg sha256 "$(sha256sum "$apk" | cut -d' ' -f1)" \
            --argjson sizeBytes "$(stat -c%s "$apk")" \
            --argjson minSdk 26 \
            --arg commit "$GITHUB_SHA" \
            --arg releaseUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            '$ARGS.named' > dist/release-metadata.json
          cat dist/release-metadata.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # --verify-tag: never create a tag by accident from a manual run.
          gh release create "$TAG" --verify-tag --generate-notes \
            dist/hakiosk-*.apk dist/release-metadata.json

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
