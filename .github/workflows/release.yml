## Builds, signs and publishes a release APK. See docs/RELEASE-OTA.md.
##
## The signing key lives in the PRODUCTION environment's secrets, so this job declares
## `environment: PRODUCTION`: without that line the secrets arrive empty and signing fails.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v1.0.0"
        required: true

# Nothing by default; the job below asks for exactly what it needs.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: PRODUCTION
    permissions:
      contents: write # create the release and upload its assets
    env:
      # One APK per ABI plus the universal fallback. Must match the `splits` block in
      # app/build.gradle.kts; a missing one fails the run instead of publishing a partial release.
      ABIS: "armeabi-v7a arm64-v8a x86 x86_64 universal"
    steps:
      # Runs before the checkout so a malformed tag fails in seconds.
      - name: Resolve the version from the tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$tag' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          # versionCode = major*10000 + minor*100 + patch, so it only ever grows.
          if (( minor > 99 || patch > 99 )); then
            echo "::error::minor and patch must stay below 100 to keep versionCode monotonic"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "name=${tag#v}"
            echo "code=$(( major * 10000 + minor * 100 + patch ))"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.tag }}
          persist-credentials: false

      # Matches gradle/gradle-daemon-jvm.properties (toolchainVersion 25), so Gradle uses this JDK
      # instead of downloading its own.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      # Handles the Gradle cache and wrapper validation. Gradle's own docs advise against
      # actions/setup-java's `cache: gradle` for this.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Decode the signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # $RUNNER_TEMP, never the workspace: nothing here can end up in the published assets.
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          if [[ ! -s "$RUNNER_TEMP/release.keystore" ]]; then
            echo "::error::Empty keystore. The secrets live in the PRODUCTION environment: check that this job still declares 'environment: PRODUCTION' and that RELEASE_KEYSTORE_BASE64 is set there."
            exit 1
          fi

      - name: Build and test the signed release
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          # testDebugUnitTest, not testReleaseUnitTest: AGP only creates unit test tasks for the
          # testBuildType (debug), and these tests are plain JVM logic, variant-independent.
          # -PabiSplits: one APK per ABI, so a tablet downloads ~19 MB instead of ~60 MB per update.
          ./gradlew assembleRelease testDebugUnitTest --console=plain -PabiSplits \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Verify the signature
        run: |
          set -euo pipefail
          out=app/build/outputs/apk/release
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          fingerprints=""
          for abi in $ABIS; do
            apk="$out/app-$abi-release.apk"
            # Without a key Gradle emits *-unsigned.apk instead of failing: catch that here rather
            # than publishing something the tablets would refuse to install.
            if [[ ! -f "$apk" ]]; then
              echo "::error::No signed APK for $abi at $apk — the signing key never reached Gradle."
              ls -1 "$out"
              exit 1
            fi
            echo "--- $abi"
            "$apksigner" verify --verbose --print-certs "$apk"
            fingerprints+="$("$apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"$'\n'
          done
          # The certificate is public; its SHA-256 must stay identical across every APK and every
          # release, or the tablets reject the update. See docs/SETUP.md.
          if [[ "$(printf '%s' "$fingerprints" | sort -u | wc -l)" -ne 1 ]]; then
            echo "::error::The APKs are not all signed with the same certificate:"
            printf '%s' "$fingerprints"
            exit 1
          fi

      - name: Prepare the assets
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          mkdir -p dist
          apks='{}'
          for abi in $ABIS; do
            name="hakiosk-$VERSION_NAME-$abi.apk"
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "dist/$name"
            # Every ABI keeps the release's single versionCode: no per-ABI offsets.
            apks="$(jq -n \
              --argjson acc "$apks" \
              --arg abi "$abi" \
              --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$name" \
              --arg sha256 "$(sha256sum "dist/$name" | cut -d' ' -f1)" \
              --argjson sizeBytes "$(stat -c%s "dist/$name")" \
              '$acc + {($abi): {url: $url, sha256: $sha256, sizeBytes: $sizeBytes}}')"
          done
          # What the tablets read to decide whether to update, which APK to pull, and to verify what
          # they downloaded. Contract described in docs/RELEASE-OTA.md.
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --argjson minSdk 26 \
            --arg commit "$GITHUB_SHA" \
            --arg releaseUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            --argjson apks "$apks" \
            '$ARGS.named' > dist/release-metadata.json
          cat dist/release-metadata.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # --verify-tag: never create a tag by accident from a manual run.
          gh release create "$TAG" --verify-tag --generate-notes \
            dist/hakiosk-*.apk dist/release-metadata.json

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
